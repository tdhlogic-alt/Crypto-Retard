server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: crypto-bot-starter
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info

bot:
  enabled: true
  dry-run: ${BOT_DRY_RUN:true}
  fixed-rate-ms: 900000
  exit-on-completion: ${BOT_EXIT_ON_COMPLETION:true}

  # Controlled active universe: broader than the preservation list, but still avoids ultra-illiquid/meme-only churn.
  product-ids:
    - BTC-USD
    - ETH-USD
    - SOL-USD
    - LINK-USD
    - AVAX-USD
    - SUI-USD
    - ADA-USD
    - XRP-USD
    - NEAR-USD
    - RNDR-USD
    - ONDO-USD
    - DOGE-USD
    - LTC-USD
    - BCH-USD
    - DOT-USD
    - UNI-USD
    - AAVE-USD
    - INJ-USD
    - ARB-USD
    - OP-USD
    - SEI-USD
    - ATOM-USD

  buy-quote-size-usd: ${BOT_BUY_QUOTE_SIZE_USD:25.00}
  min-usd-cash-reserve: ${BOT_MIN_USD_CASH_RESERVE:200.00}
  max-single-buy-usd: ${BOT_MAX_SINGLE_BUY_USD:75.00}
  dip-threshold-percent: ${BOT_DIP_THRESHOLD_PERCENT:4.0}

  discord-webhook-url: ${DISCORD_WEBHOOK_URL:}

  max-buy-quote-size-usd: ${BOT_MAX_BUY_QUOTE_SIZE_USD:25.00}
  live-trading-enabled: ${BOT_LIVE_TRADING_ENABLED:false}

  agent-enabled: ${BOT_AGENT_ENABLED:true}
  agent-min-confidence: ${BOT_AGENT_MIN_CONFIDENCE:0.72}
  max-asset-allocation-percent: ${BOT_MAX_ASSET_ALLOCATION_PERCENT:45.0}
  min-profit-percent-for-ai-sell: ${BOT_MIN_PROFIT_PERCENT_FOR_AI_SELL:3.0}
  max-drawdown-from-high-percent: ${BOT_MAX_DRAWDOWN_FROM_HIGH_PERCENT:10.0}
  min-agent-edge-score: ${BOT_MIN_AGENT_EDGE_SCORE:68}
  strong-agent-edge-score: ${BOT_STRONG_AGENT_EDGE_SCORE:82}
  allow-ai-sell-at-loss: ${BOT_ALLOW_AI_SELL_AT_LOSS:true}
  ai-sell-loss-floor-percent: ${BOT_AI_SELL_LOSS_FLOOR_PERCENT:-6.0}
  max-ai-reason-length: ${BOT_MAX_AI_REASON_LENGTH:240}

  # Level 2 portfolio rotation: allows the agent to sell a weak held asset to fund a stronger BUY.
  level2-rotation-enabled: ${BOT_LEVEL2_ROTATION_ENABLED:false}
  min-rotation-edge-score: ${BOT_MIN_ROTATION_EDGE_SCORE:80}
  min-rotation-score-gap: ${BOT_MIN_ROTATION_SCORE_GAP:15}
  max-rotation-sell-percent: ${BOT_MAX_ROTATION_SELL_PERCENT:35.0}
  min-rotation-notional-usd: ${BOT_MIN_ROTATION_NOTIONAL_USD:10.00}

  # Multi-action execution: allows more than one validated action per scheduled run.
  max-actions-per-run: ${BOT_MAX_ACTIONS_PER_RUN:2}
  max-buys-per-run: ${BOT_MAX_BUYS_PER_RUN:1}
  max-sells-per-run: ${BOT_MAX_SELLS_PER_RUN:1}
  max-rotations-per-run: ${BOT_MAX_ROTATIONS_PER_RUN:1}
  max-total-buy-usd-per-run: ${BOT_MAX_TOTAL_BUY_USD_PER_RUN:80.00}
  max-daily-live-buys-per-product: ${BOT_MAX_DAILY_LIVE_BUYS_PER_PRODUCT:2}

  # Capital preservation guardrails. Defaults are intentionally defensive while recovering from drawdown.
  buy-cooldown-hours: ${BOT_BUY_COOLDOWN_HOURS:6}
  post-sell-cooldown-hours: ${BOT_POST_SELL_COOLDOWN_HOURS:12}
  # Caps only exposure-increasing live BUYs. SELLs are intentionally uncapped so risk-reduction exits are never blocked.
  max-daily-live-buys: ${BOT_MAX_DAILY_LIVE_BUYS:${BOT_MAX_DAILY_LIVE_TRADES:5}}
  bear-trend-min-buy-score: ${BOT_BEAR_TREND_MIN_BUY_SCORE:90}
  oversold-bounce-max-rsi: ${BOT_OVERSOLD_BOUNCE_MAX_RSI:35}
  oversold-bounce-min-recovery-trend-percent: ${BOT_OVERSOLD_BOUNCE_MIN_RECOVERY_TREND_PERCENT:0.0}
  oversold-bounce-max-price-to24h-low-percent: ${BOT_OVERSOLD_BOUNCE_MAX_PRICE_TO24H_LOW_PERCENT:103.0}
  breakout-min-trend7d-percent: ${BOT_BREAKOUT_MIN_TREND7D_PERCENT:5.0}
  breakout-min-trend24h-percent: ${BOT_BREAKOUT_MIN_TREND24H_PERCENT:1.5}
  breakout-min-price-to24h-high-percent: ${BOT_BREAKOUT_MIN_PRICE_TO24H_HIGH_PERCENT:98.0}
  breakout-max-rsi: ${BOT_BREAKOUT_MAX_RSI:72}
  momentum-min-trend1h-percent: ${BOT_MOMENTUM_MIN_TREND1H_PERCENT:0.4}
  momentum-min-trend4h-percent: ${BOT_MOMENTUM_MIN_TREND4H_PERCENT:1.0}
  momentum-min-trend24h-percent: ${BOT_MOMENTUM_MIN_TREND24H_PERCENT:2.0}
  momentum-max-rsi: ${BOT_MOMENTUM_MAX_RSI:75}
  rotation-max-funding-pnl-percent: ${BOT_ROTATION_MAX_FUNDING_PNL_PERCENT:2.0}
  min-sell-notional-usd: ${BOT_MIN_SELL_NOTIONAL_USD:10.00}

  # Strategy-first architecture. Deterministic exits/entries come before AI.
  # AI is veto-only for entries and cannot invent trades in this mode.
  strategy-mode-enabled: ${BOT_STRATEGY_MODE_ENABLED:true}
  strategy-ai-veto-enabled: ${BOT_STRATEGY_AI_VETO_ENABLED:true}
  strategy-quote-size-usd: ${BOT_STRATEGY_QUOTE_SIZE_USD:15.00}
  strategy-high-conviction-quote-size-usd: ${BOT_STRATEGY_HIGH_CONVICTION_QUOTE_SIZE_USD:25.00}
  strategy-high-conviction-min-score: ${BOT_STRATEGY_HIGH_CONVICTION_MIN_SCORE:90}
  strategy-performance-min-sample: ${BOT_STRATEGY_PERFORMANCE_MIN_SAMPLE:5}
  strategy-stop-loss-percent: ${BOT_STRATEGY_STOP_LOSS_PERCENT:4.0}
  strategy-take-profit-percent: ${BOT_STRATEGY_TAKE_PROFIT_PERCENT:8.0}
  strategy-trailing-drawdown-percent: ${BOT_STRATEGY_TRAILING_DRAWDOWN_PERCENT:4.0}
  strategy-min-trend7d-percent: ${BOT_STRATEGY_MIN_TREND7D_PERCENT:2.0}
  strategy-min-recovery4h-percent: ${BOT_STRATEGY_MIN_RECOVERY4H_PERCENT:0.0}
  strategy-max-entry24h-percent: ${BOT_STRATEGY_MAX_ENTRY24H_PERCENT:4.0}
  strategy-max-entry-rsi: ${BOT_STRATEGY_MAX_ENTRY_RSI:60}
  strategy-max-hold-hours: ${BOT_STRATEGY_MAX_HOLD_HOURS:168}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.4-mini}

resilience4j:
  circuitbreaker:
    instances:
      coinbaseApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50.0
        recordExceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

coinbase:
  base-url: https://api.coinbase.com
  api-key-name: ${COINBASE_API_KEY_NAME:}
  private-key-pem: ${COINBASE_PRIVATE_KEY_PEM:}

  # Coinbase API protection. Keeps the expanded product universe from creating request bursts.
  # Product metadata is effectively static for this bot; use a long TTL for non-exiting/local runs.
  product-cache-ttl: ${COINBASE_PRODUCT_CACHE_TTL:6h}
  rate-limit-for-period: ${COINBASE_RATE_LIMIT_FOR_PERIOD:6}
  rate-limit-refresh-period: ${COINBASE_RATE_LIMIT_REFRESH_PERIOD:1s}
  rate-limit-timeout: ${COINBASE_RATE_LIMIT_TIMEOUT:5s}
  retry-max-attempts: ${COINBASE_RETRY_MAX_ATTEMPTS:3}
  retry-initial-backoff: ${COINBASE_RETRY_INITIAL_BACKOFF:2s}
  retry-max-backoff: ${COINBASE_RETRY_MAX_BACKOFF:20s}
  snapshot-concurrency: ${COINBASE_SNAPSHOT_CONCURRENCY:3}
